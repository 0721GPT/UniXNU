name: fuxi Data seed (20H392)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data-seed:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out matching fuxi board
        uses: actions/checkout@v4
        with:
          repository: 0721GPT/UniXNU-fuxi
          ref: b6c5afce2159b0ca4aad85d77fa0bb3a3d439079
          path: device
      - name: Check out the pinned DarwinBoot packer
        run: git submodule update --init drivers/DarwinBoot
      - name: Build APFS Data seed from matching OS
        run: sudo "$(which python)" scripts/build-fuxi-data-seed.py --core . --board device/board.toml --output "$RUNNER_TEMP/fuxi-data"
      - name: Upload Data seeds
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-data-seed-20H392
          path: |
            ${{ runner.temp }}/fuxi-data/data.dbr
            ${{ runner.temp }}/fuxi-data/scratch-data.img
            ${{ runner.temp }}/fuxi-data/data-seed.json
            ${{ runner.temp }}/fuxi-data/README.txt
          if-no-files-found: error
          retention-days: 7
